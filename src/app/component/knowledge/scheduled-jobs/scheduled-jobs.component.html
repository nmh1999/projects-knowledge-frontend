<section class="detail-card">
  <h3>
    {{ language.t('scheduledJobsTitle') }} <span>{{ items().length }}</span>
  </h3>
  @for (item of items(); track item.name) {
    <article>
      <span>◷</span>
      <div>
        <strong>{{ item.name }}</strong
        ><code>{{ item.schedule }}</code>
      </div>
    </article>
  }
</section>
